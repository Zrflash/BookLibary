<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Bookshelf</title>
<meta property="og:title" content="Bookshelf"><meta property="og:description" content="My book collection, wishlist and reading stats."><meta property="og:type" content="website"><meta name="theme-color" content="#1f3a5f">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#16202e;--mut:#6b7686;--line:#dde2e9;--acc:#1f3a5f;--on:#fff;--g:#22b573;--r:#e5484d;--fav:#cf7f89}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#19212b;--ink:#eef2f7;--mut:#8f9bad;--line:#27313e;--acc:#8fb4e8;--on:#0c1624;--fav:#d9959d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding:0 0 90px}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 6px}
h1{font:700 28px/1 ui-serif,Georgia,serif;margin:0;letter-spacing:-.01em}
h2{font:700 20px/1.2 ui-serif,Georgia,serif;margin:0 0 12px}
main{padding:8px 16px;max-width:640px;margin:0 auto}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px}
button.p{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
button.d{color:var(--r)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:0 0 10px}
.chips{display:flex;gap:8px;margin:0 0 12px}
.chips button{padding:6px 14px;border-radius:99px;font-size:14px}
.chips button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 0 8px;cursor:pointer}
.cv{width:44px;height:62px;border-radius:3px 6px 6px 3px;flex:none;overflow:hidden;display:grid;place-items:center;color:#fff;font:700 20px ui-serif,Georgia,serif;box-shadow:inset 4px 0 0 rgba(0,0,0,.2)}
.cv img{width:100%;height:100%;object-fit:cover}
.mt{flex:1;min-width:0}.mt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt span{color:var(--mut);font-size:14px}
.st{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut);padding:8px 10px;border-radius:99px}
.st i{width:14px;height:14px;border-radius:50%;background:var(--g);box-shadow:0 0 0 4px color-mix(in srgb,var(--g) 22%,transparent)}
.st.o i{background:var(--r);box-shadow:0 0 0 4px color-mix(in srgb,var(--r) 22%,transparent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.bar button{flex:1;min-width:calc(50% - 4px)}
.mut{color:var(--mut);font-size:14px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav button{flex:1;border:0;background:none;color:var(--mut);font-weight:600;padding:12px 4px}
nav button.on{color:var(--acc)}
#m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
#m.show{display:flex}
#mb{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
video{width:100%;border-radius:12px;background:#000;margin:0 0 10px;aspect-ratio:4/3;object-fit:cover}
label.ck{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
label.ck input{width:auto;margin:0}
#t{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:40;display:none;max-width:90%}
.qr{width:100%;border-radius:10px;background:#fff}
.f button.rec{background:var(--r);color:#fff;border-color:var(--r)}
#sc{position:fixed;inset:0;background:#000;z-index:30}
#sc video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;margin:0;aspect-ratio:auto;border-radius:0}
#sc:after{content:'';position:absolute;left:7%;right:7%;top:36%;height:28%;border:2px solid #fff9;border-radius:14px;pointer-events:none}
#sct{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 18px;background:linear-gradient(#000b,#0000);color:#fff}
#sct button{background:#0009;color:#fff;border-color:#fff5}
.cvs{position:relative;display:flex;gap:18px;align-items:center;overflow-x:auto;scroll-snap-type:x mandatory;padding:42px calc(50% - 60px) 46px;margin:0 0 10px;background:radial-gradient(55% 75% at 50% 50%,color-mix(in srgb,var(--acc) 28%,transparent),transparent 72%);scrollbar-width:none}
.cvs::-webkit-scrollbar{display:none}
.cvs.two{justify-content:center;padding-inline:0}
.cp{position:relative;flex:none;width:120px;aspect-ratio:2/3;border-radius:5px 12px 12px 5px;overflow:hidden;scroll-snap-align:center;display:grid;place-items:center;color:#fff;font:700 34px ui-serif,Georgia,serif;cursor:pointer;opacity:.55;filter:brightness(1.18) saturate(.55);transform:scale(.88);box-shadow:0 6px 14px rgba(0,0,0,.18),inset 5px 0 0 rgba(0,0,0,.18);transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s,filter .3s,box-shadow .3s}
.cp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cp:after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.32),rgba(255,255,255,0) 42%);pointer-events:none}
.cp.sel{opacity:1;filter:none;transform:scale(1.12);box-shadow:0 22px 40px rgba(0,0,0,.4),0 0 0 3px var(--acc),0 0 42px 8px color-mix(in srgb,var(--acc) 60%,transparent),inset 5px 0 0 rgba(0,0,0,.2)}
.cp.add{background:rgba(128,128,128,.22);border:2px solid rgba(128,128,128,.4);box-shadow:none;color:var(--mut);font:300 56px/1 -apple-system,system-ui,sans-serif;opacity:1;filter:none;backdrop-filter:blur(4px)}
.cp.add:after{display:none}.cp.add:active{transform:scale(.82)}
.bd{position:absolute;left:6px;top:6px;z-index:2;font:600 10px/1 -apple-system,sans-serif;background:var(--g);color:#06251a;padding:4px 7px;border-radius:99px;font-style:normal}
.cv[data-act]{cursor:pointer}
.av{width:40px;height:40px;border-radius:50%;padding:0;overflow:hidden;position:relative;display:grid;place-items:center;font:700 18px ui-serif,Georgia,serif;background:var(--acc);color:var(--on);border:2px solid var(--card);box-shadow:0 0 0 1px var(--line),0 4px 12px rgba(0,0,0,.18)}
.av img,.sav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.big.av{width:84px;height:84px;font-size:34px;flex:none}
.pt{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;scrollbar-width:none}.pt::-webkit-scrollbar{display:none}
.pt button{flex:none;border-radius:99px;padding:8px 14px;font-size:14px}.pt button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.pav{display:flex;gap:14px;align-items:center;margin:0 0 14px}.pav>div:last-child{display:flex;flex-direction:column;gap:8px}
.vt{margin-left:auto;padding:6px 12px;border-radius:99px;display:grid;place-items:center;font-size:13px}.vt+.vt{margin-left:0}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:18px 14px}
.gt{position:relative;cursor:pointer}
.gt .cv{width:100%;height:auto;aspect-ratio:2/3;border-radius:4px 10px 10px 4px;font-size:30px;box-shadow:inset 5px 0 0 rgba(0,0,0,.2),0 6px 14px rgba(0,0,0,.18)}
.gd{position:absolute;right:8px;top:8px;width:9px;height:9px;border-radius:50%;padding:0;border:0;background:radial-gradient(circle at 35% 32%,rgba(255,255,255,.85) 0 14%,var(--g) 46%);box-shadow:0 0 0 1.5px rgba(0,0,0,.4),0 0 5px 1px var(--g),0 0 12px 3px color-mix(in srgb,var(--g) 55%,transparent)}
.gd.o{background:radial-gradient(circle at 35% 32%,rgba(255,255,255,.8) 0 14%,var(--r) 46%);box-shadow:0 0 0 1.5px rgba(0,0,0,.4),0 0 5px 1px var(--r),0 0 12px 3px color-mix(in srgb,var(--r) 55%,transparent)}
button.gd:before{content:'';position:absolute;inset:-14px}
.hb{border:0;background:none;padding:6px;color:var(--mut);opacity:.45;display:grid;place-items:center;transition:opacity .2s,color .2s}.hb.on{color:var(--fav);opacity:.95}.hb.on svg path{fill-opacity:.75}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:8px;margin:12px 0}.nums div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}.nums b{display:block;font:700 22px ui-serif,Georgia,serif}.nums span{font-size:12px;color:var(--mut)}
.srow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 0 8px}
.srow small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:700}
.srow .mt span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr{flex-direction:column;align-items:stretch;cursor:default}.wr .top{display:flex;gap:12px;align-items:center}.acts{display:flex;gap:8px}.acts button{flex:1;padding:8px}
.cap b{display:block;font-size:13px;font-weight:600;margin-top:6px;line-height:1.2}.cap span{font-size:12px;color:var(--mut)}
#shv{position:fixed;inset:0;background:var(--bg);z-index:25;overflow:auto}
.shb{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.shb b{font:700 20px ui-serif,Georgia,serif}
.shc{max-width:640px;margin:0 auto;padding:18px 16px 60px}
.shh{display:flex;gap:14px;align-items:center;margin:0 0 14px}.shh h2{margin:0}
.sav{position:relative;flex:none;width:64px;height:64px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--acc);color:var(--on);font:700 26px ui-serif,Georgia,serif}
#sc.fl:before{content:'';position:absolute;inset:0;background:rgba(34,181,115,.38);animation:flo .55s ease-out forwards;z-index:1;pointer-events:none}@keyframes flo{to{opacity:0}}
#scc{width:46px;height:46px;padding:0;display:grid;place-items:center;border-radius:50%}
#scc.on{background:var(--g);color:#06251a;border-color:var(--g)}
.scn #t{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
#sct span{flex:1;font-size:15px;text-align:right}
.f{display:flex;gap:8px}.f input{flex:1;min-width:0}.f button{flex:none;margin:0 0 10px}

/* ===== v3 ===== */
:root{--dg:#52a768;--dr:#d95a60}
:root[data-theme="dark"]{--bg:#10151c;--card:#19212b;--ink:#eef2f7;--mut:#8f9bad;--line:#27313e;--acc:#8fb4e8;--on:#0c1624;--fav:#d9959d}
:root[data-theme="light"]{--bg:#eef1f4;--card:#fff;--ink:#16202e;--mut:#6b7686;--line:#dde2e9;--acc:#1f3a5f;--on:#fff;--fav:#cf7f89}
.adapt main,.adapt header,.adapt nav,.adapt #mb{zoom:var(--z)}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;align-items:center}.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;flex:none}
.f.s2{margin:0 0 10px}.f.s2 input{margin:0}.f.s2 button{margin:0}
.dc{width:46px;padding:0;display:grid;place-items:center}
.two{display:flex;gap:8px;margin:0 0 10px}.two>*{flex:1;min-width:0;margin:0}
.mt .x{display:block;font-size:12px;color:var(--mut)}
.row.fv{box-shadow:inset 3px 0 0 var(--fav)}
.dense .row{padding:6px 8px}.dense .row .cv{width:34px;height:48px;font-size:16px}
.gloss .cv{position:relative}.gloss .cv:after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.35),rgba(255,255,255,0) 45%);pointer-events:none}
.gd{width:14px;height:14px;right:-4px;bottom:-4px;top:auto;border:4px solid var(--bg);box-sizing:content-box;background:var(--dg);box-shadow:none}
.gd.o{background:var(--dr);box-shadow:none}
button.gd:before{inset:-12px}
/* swipe rows */
.sw{position:relative;margin:0 0 8px;border-radius:12px;overflow:hidden;touch-action:pan-y}
.sw .row{margin:0;position:relative;z-index:1;will-change:transform}
.swf,.swr{position:absolute;inset:0;display:none;align-items:center}
.sw.al .swf{display:flex}.sw.ar .swr{display:flex}
.swf{background:var(--fav);padding-left:24px;color:#fff}
.swf svg{transform:scale(calc(.6 + var(--p,0)*.6));opacity:calc(.4 + var(--p,0)*.6)}
.sw.go .swf{filter:brightness(1.08)}
.swr{justify-content:flex-end;gap:8px;padding-right:12px;background:var(--bg)}
.sc{width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;color:var(--mut);font-size:11px}
.sc .ci{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff}
.sc .ci.b{background:#3a82f7}.sc .ci.r{background:var(--dr)}
.sw.full .swr{background:var(--dr)}.sw.full .sc{opacity:0}
.swr .tr{position:absolute;right:26px;color:#fff;opacity:0}.sw.full .swr .tr{opacity:1}
#ut{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);display:none;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:14px;z-index:8}
#ut span{flex:1;font-size:14px}#ut button{background:none;border:0;color:#2f6fd6;font-weight:700;padding:8px 12px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--on)}.chk.on{background:var(--acc);border-color:var(--acc)}
/* random picker */
.rw{position:relative;height:210px;overflow:hidden;margin:6px -16px 10px;background:radial-gradient(60% 80% at 50% 50%,color-mix(in srgb,var(--acc) 28%,transparent),transparent 72%)}
.rt{position:absolute;left:0;top:50%;display:flex;gap:14px;transform:translateY(-50%);will-change:transform}
.rc{flex:none;width:104px;aspect-ratio:2/3;border-radius:5px 10px 10px 5px;overflow:hidden;position:relative;display:grid;place-items:center;color:#fff;font:700 30px ui-serif,Georgia,serif;opacity:.5;filter:saturate(.6) brightness(1.1);transform:scale(.88);transition:transform .15s,opacity .15s,filter .15s;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.rc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rc.mid{opacity:1;filter:none;transform:scale(1.08)}
.rc.won{opacity:1;filter:none;transform:scale(1.3);z-index:2;box-shadow:0 22px 44px rgba(0,0,0,.45),0 0 0 3px var(--acc),0 0 56px 12px color-mix(in srgb,var(--acc) 65%,transparent);animation:wonp 1.3s ease-in-out infinite alternate}
@keyframes wonp{to{box-shadow:0 22px 44px rgba(0,0,0,.45),0 0 0 3px var(--acc),0 0 84px 24px color-mix(in srgb,var(--acc) 80%,transparent)}}
.rm{position:absolute;left:50%;top:6px;bottom:6px;border-left:2px dashed color-mix(in srgb,var(--acc) 55%,transparent);pointer-events:none;z-index:3}
.cf{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:4;animation:cfa 1.1s ease-out forwards}
@keyframes cfa{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
/* add tab */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:0 0 14px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--mut)}.seg button.on{background:var(--acc);color:var(--on)}
.hero{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px;border-radius:18px;border:0;color:#fff;background:linear-gradient(135deg,#1f3a5f,#3a6fd6);box-shadow:0 12px 28px rgba(31,58,95,.35);margin:0 0 14px}
.hero svg{flex:none}.hero b{display:block;font-size:18px}.hero span{opacity:.85;font-size:13px;display:block}
.pv{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin:0 0 12px;min-height:84px}
.pv .mt b{white-space:normal}
.shm{background:linear-gradient(100deg,rgba(128,128,128,.14) 30%,rgba(128,128,128,.3) 50%,rgba(128,128,128,.14) 70%);background-size:200% 100%;animation:shm 1.2s linear infinite}
@keyframes shm{to{background-position:-200% 0}}
/* cover loading */
.ldb{height:3px;border-radius:3px;overflow:hidden;background:var(--line);margin:0 0 2px}.ldb i{display:block;height:100%;width:40%;background:var(--acc);border-radius:3px;animation:ldb 1.1s ease-in-out infinite}
@keyframes ldb{0%{margin-left:-40%}100%{margin-left:100%}}
.cp.sk{cursor:default;opacity:.8;filter:none;box-shadow:none}.cp.sk:after{display:none}
.cp.in{animation:cin .5s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes cin{from{opacity:0;transform:translateY(16px) scale(.7)}}
/* scanner */
#scv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#sct{z-index:3;justify-content:space-between}
#scb{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:3;background:rgba(15,20,28,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;border-radius:18px;padding:14px 16px;text-align:center}
#scb b{display:block;font-size:17px;margin:0 0 4px}#scb span{font-size:14px;opacity:.85}
#sc:after{display:none}
/* group editor + cards */
.pkg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;margin:0 0 14px}
.pkt{position:relative;cursor:pointer}
.pkt .cv{width:100%;height:auto;aspect-ratio:2/3;border-radius:4px 10px 10px 4px;font-size:28px;transition:transform .15s,opacity .15s,box-shadow .15s;opacity:.6}
.pkt.on .cv{opacity:1;transform:scale(.96);box-shadow:0 0 0 3px var(--acc),0 8px 20px rgba(0,0,0,.3)}
.pkt .k2{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--on);display:none;place-items:center;border:3px solid var(--bg);box-sizing:content-box;z-index:2}
.pkt.on .k2{display:grid}
.pkt .cap{font-size:12px;margin-top:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sws{display:flex;gap:10px;margin:0 0 14px}.sws i{width:30px;height:30px;border-radius:50%;cursor:pointer;box-shadow:0 0 0 2px var(--line)}.sws i.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.gc{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px;cursor:pointer;border-left:5px solid var(--gcol,var(--acc))}
.stk{display:flex;flex:none;min-width:36px}.stk .cv{width:36px;height:52px;margin-left:-14px;border:2px solid var(--card);box-shadow:0 4px 10px rgba(0,0,0,.25);font-size:16px}.stk .cv:first-child{margin-left:0}
/* settings + profile */
.sg{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden}
.sg h4{margin:0;padding:12px 14px 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.sr{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.sr .mt b,.sr .mt span{white-space:normal}.sr .mt b{font-weight:600}.sr input{margin:0;flex:1}
.tg{position:relative;width:48px;height:28px;flex:none}.tg input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;z-index:2;cursor:pointer}
.tg i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s}
.tg i:after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.tg input:checked+i{background:var(--dg)}.tg input:checked+i:after{transform:translateX(20px)}

<script>

function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}

async function lookup(isbn){
  const w=await api('/api/book/'+isbn);
  if(w&&w.title)return{title:w.title,author:w.author||'',cover:'',pub:w.pub,date:w.date,pages:w.pages,lang:w.lang,bind:w.bind,msrp:w.msrp,cur:w.msrp!=null?'USD':undefined,syn:w.syn,subj:w.subj,dewey:w.dewey};
  try{const r=await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);const j=await r.json();const d=j['ISBN:'+isbn];
    if(d)return{title:d.title+(d.subtitle?': '+d.subtitle:''),author:(d.authors||[]).map(a=>a.name).join(', '),cover:(d.cover&&d.cover.medium)||''}}catch(e){}
  try{const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);const j=await r.json();const v=j.items&&j.items[0]&&j.items[0].volumeInfo;
    if(v)return{title:v.title+(v.subtitle?': '+v.subtitle:''),author:(v.authors||[]).join(', '),cover:((v.imageLinks&&v.imageLinks.thumbnail)||'').replace('http:','https:')}}catch(e){}
  return null;
}
function addBook(o){
  o.isbn=toIsbn(o.isbn||'')||o.isbn||'';
  if(o.isbn&&!toIsbn(o.isbn)){o.ean=o.ean||o.isbn;o.isbn=''}
  if((o.isbn&&S.books.some(b=>(toIsbn(b.isbn)||b.isbn)===o.isbn))||(o.ean&&S.books.some(b=>b.ean===o.ean))){toast('Already in your library');return false}
  const nb={id:uid(),title:o.title,author:o.author||'',isbn:o.isbn||'',cover:o.cover||'',notes:o.notes||'',out:false,outs:0,added:Date.now(),since:Date.now()};
  ['pub','date','pages','lang','bind','msrp','cur','syn','subj','dewey','ean'].forEach(k=>{if(o[k]!=null&&o[k]!=='')nb[k]=o[k]});
  if(nb.msrp!=null&&!nb.cur)nb.cur='USD';
  if(beta('dupwarn')&&S.books.some(b=>nrm(b.title)===nrm(nb.title)))toast('Heads up: you may already own another edition');
  S.books.push(nb);save();return nb;
}
async function isbnAdd(isbn,keep,ex){
  if(scanG)return addToGroup(isbn,ex);
  toast('Looking up '+isbn+'\u2026');
  const d=await lookup(isbn)||await lookupBC(isbn);
  const extra=ex&&ex.msrp!=null?{msrp:ex.msrp,cur:ex.cur}:{};
  if(d&&addBook({...d,isbn,...extra})){toast('Added: '+d.title);ding();if(keep)bump();else{view='lib';render()}}
  else if(!d){
    if(keep){addBook({title:'Unknown book '+isbn,isbn,...extra});toast('Not found. Saved as Unknown book so you can edit it later.');bump()}
    else{draft={isbn,...extra};addTab='type';view='add';render();toast('Not found. Type the title in.')}
  }
}
const scs=t=>{const e=$('#scs');if(e)e.textContent=t};
let lock=null,lcur=null,wl=null;
function setLock(box,label){if(box)lock={...box,label,t:performance.now()}}
function barMeta(r){
  let box=null,label='',ext=null;
  try{const p=r.getResultPoints()||[];if(p.length){const xs=p.map(q=>q.getX()),ys=p.map(q=>q.getY());let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);if(y1-y0<12){const h=(x1-x0)*.28;y0-=h;y1+=h}box={x0,y0,x1,y1}}}catch(e){}
  try{const md=r.getResultMetadata&&r.getResultMetadata(),E=md&&md.get(ZXing.ResultMetadataType.UPC_EAN_EXTENSION);if(E)ext=String(E)}catch(e){}
  try{const f=String(ZXing.BarcodeFormat[r.getBarcodeFormat()]||'').replace(/_/g,'-'),t=r.getText();label=(/^EAN-13$/.test(f)?codeKind(t):f)+' \u00b7 '+t+(ext?' + '+ext:'')}catch(e){}
  return{box,label,ext};
}
function lockLoop(){
  const cv=$('#scv'),v=$('#v');if(!cv||!v)return;
  const W=cv.clientWidth,H=cv.clientHeight,dpr=window.devicePixelRatio||1;
  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const now=performance.now(),vw=v.videoWidth,vh=v.videoHeight,on=!!(lock&&vw&&now-lock.t<900);
  let tg={x:W*.07,y:H*.33,w:W*.86,h:H*.27};
  if(on){const sc=Math.max(W/vw,H/vh),ox=(W-vw*sc)/2,oy=(H-vh*sc)/2,pd=16;tg={x:lock.x0*sc+ox-pd,y:lock.y0*sc+oy-pd,w:(lock.x1-lock.x0)*sc+pd*2,h:(lock.y1-lock.y0)*sc+pd*2}}
  if(!lcur)lcur={...tg};
  for(const k of['x','y','w','h'])lcur[k]+=(tg[k]-lcur[k])*.25;
  const r=lcur;
  x.fillStyle=on?'rgba(0,0,0,.4)':'rgba(0,0,0,.22)';x.fillRect(0,0,W,H);x.clearRect(r.x,r.y,r.w,r.h);
  const L=Math.min(r.w,r.h)*.2+8;
  x.lineWidth=4;x.lineCap='round';x.strokeStyle=on?'#2ee59d':'#fff';x.shadowColor=on?'rgba(46,229,157,.9)':'transparent';x.shadowBlur=on?16:0;
  [[r.x,r.y,1,1],[r.x+r.w,r.y,-1,1],[r.x,r.y+r.h,1,-1],[r.x+r.w,r.y+r.h,-1,-1]].forEach(([cx,cy,dx,dy])=>{x.beginPath();x.moveTo(cx,cy+dy*L);x.lineTo(cx,cy);x.lineTo(cx+dx*L,cy);x.stroke()});
  x.shadowBlur=0;
  if(!on){const t=(Math.sin(now/450)+1)/2;x.fillStyle='rgba(255,70,70,.8)';x.fillRect(r.x+10,r.y+10+t*(r.h-24),r.w-20,2)}
  else if(lock.label){x.font='600 14px -apple-system,sans-serif';const tw=x.measureText(lock.label).width+22,cx=Math.max(8,Math.min(W-tw-8,r.x+r.w/2-tw/2)),cy=Math.max(70,r.y-36);x.fillStyle='rgba(20,160,110,.95)';rr(x,cx,cy,tw,28,14);x.fill();x.fillStyle='#fff';x.fillText(lock.label,cx+11,cy+19)}
  requestAnimationFrame(lockLoop);
}
function scan(cb,multi,ocr){
  if(!navigator.mediaDevices||!window.ZXing){toast('Camera not available. Allow camera access, or type or speak the ISBN.');return}
  closeM();audioInit();
  const o=document.createElement('div');o.id='sc';
  o.innerHTML=`<video id="v" playsinline muted></video><canvas id="scv"></canvas><div id="sct"><button data-act="close">Done</button>${ocr?`<button id="scc" data-act="cont" class="${cont?'on':''}" aria-pressed="${cont}" title="Continuous scan ${cont?'on':'off'}">${cIcon()}</button>`:''}</div><div id="scb"><b>${ocr?'Scan the barcode or printed ISBN':'Scan the QR code'}</b><span id="scs">${ocr?(cont?'Continuous scan on. Show an ISBN or barcode':'Hold the book steady. Price add-on is read too'):'Point at the QR code'}</span></div>`;
  document.body.appendChild(o);document.body.classList.add('scn');lock=null;lcur=null;
  rd=new ZXing.BrowserMultiFormatReader();let done=0;
  rd.decodeFromConstraints({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}},'v',r=>{
    if(!r||done)return;
    const t=r.getText(),m=barMeta(r);setLock(m.box,m.label);
    if(multi){if(cb(t,'bc',m))closeM()}
    else{done=1;setTimeout(()=>{closeM();cb(t)},450)}
  }).catch(()=>{closeM();toast('Camera blocked. Allow camera access, or type or speak the ISBN.')});
  lockLoop();
  if(beta('wake')&&navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{});
  if(ocr)setTimeout(()=>ocrLoop(cb),700);
}
async function ocrLoop(cb){
  if(!$('#sc'))return;ocrOn=true;const v=$('#v');
  try{
    if(!window.Tesseract){scs('Loading text reader\u2026');await loadJS('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js')}
    if(!tess){tess=await Tesseract.createWorker('eng');await tess.setParameters({tessedit_pageseg_mode:'11'})}
  }catch(e){ocrOn=false;scs('Text reader unavailable. Scanning barcode only.');cb('','noocr');return}
  const c=document.createElement('canvas'),x=c.getContext('2d');let n=0;
  while(ocrOn&&$('#sc')){
    if(v&&v.videoWidth){
      const k=Math.min(1,1600/v.videoWidth);c.width=v.videoWidth*k;c.height=v.videoHeight*k;
      if(n%2){x.save();x.translate(c.width,c.height);x.rotate(Math.PI);x.drawImage(v,0,0,c.width,c.height);x.restore()}else x.drawImage(v,0,0,c.width,c.height);
      scs(scanN?'Added '+scanN+'. Reading the next ISBN\u2026':'Reading the printed ISBN\u2026');
      try{
        const r=await tess.recognize(c);if(!ocrOn)break;
        let box=null;const ln=(r.data.lines||[]).find(l=>ocrIsbn(l.text));
        if(ln&&ln.bbox){let{x0,y0,x1,y1}=ln.bbox;if(n%2){[x0,x1]=[c.width-x1,c.width-x0];[y0,y1]=[c.height-y1,c.height-y0]}box={x0:x0/k,y0:y0/k,x1:x1/k,y1:y1/k}}
        if(cb(r.data.text,'ocr',{box})){closeM();break}
      }catch(e){}
      n++;
    }
    await new Promise(r=>setTimeout(r,200));
  }
}

function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function qrCanvas(text,title){
  const qr=qrcode(0,'L');qr.addData(text);qr.make();
  const n=qr.getModuleCount(),cs=Math.max(3,Math.floor(560/n)),pad=40,sz=n*cs+pad*2,c=document.createElement('canvas');
  c.width=sz;c.height=sz+50;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(qr.isDark(r,k))x.fillRect(pad+k*cs,pad+r*cs,cs,cs);
  x.font='bold 28px -apple-system,sans-serif';x.textAlign='center';x.fillText(title.slice(0,28),sz/2,sz+14);
  return c;
}
function showQR(id){
  const g=S.groups.find(x=>x.id===id);if(!g)return;
  const txt='g:'+encodeURIComponent(g.name.replace(/\|/g,' '))+'|~'+g.id;
  const base=S.url||(location.protocol.startsWith('http')?location.origin+location.pathname:'');
  const link=base?base+'#/group/'+g.id:'shortcuts://run-shortcut?name=Bookshelf&input=text&text='+encodeURIComponent(txt);
  let c;
  try{c=qrCanvas(link,g.name)}catch(e){toast('Too many books for one QR. Split the group.');return}
  const url=c.toDataURL('image/png');
  modal(`<h2>${esc(g.name)} QR</h2><img class="qr" src="${url}" alt="QR code for ${esc(g.name)}">
  <p class="mut">Press and hold the image to save it to Photos, or use the buttons. This code never goes out of date: it always opens the group's current books, even after you add or remove some. Older codes keep working too.</p>
  <div class="bar"><a id="dl" download="${esc(g.name)}-qr.png" href="${url}" style="display:none"></a><button class="p" data-act="saveqr">Save image</button><button data-act="grp" data-id="${id}">Back</button></div>`);
  window._qr={url,name:g.name};
}
async function saveQR(){
  const {url,name}=window._qr;
  try{const f=new File([await (await fetch(url)).blob()],name+'-qr.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==='AbortError')return}

function showGroup(id){

  modal(`<h2>${esc(g.name)}</h2>${bs.length?bs.map(b=>`<div class="row" style="cursor:default">${cover(b,1,id)}<div class="mt"><b>${esc(b.title)}</b><span>${esc(b.author)}</span></div>${dot(b)}</div>`).join(''):'<div class="empty">No books in this group.</div>'}
  <div class="bar"><button class="p" data-act="qr" data-id="${id}">Make QR code</button><button data-act="editg" data-id="${id}">Edit</button></div>
  <div class="bar"><button data-act="close">Close</button></div>`);
}
function showShared(p){
  const items=p.b.map(x=>{const id=Array.isArray(x)?x[0]:x,t=Array.isArray(x)?x[1]:'';return{b:S.books.find(b=>b.id===id)||S.books.find(b=>t&&b.title.startsWith(t)),t}});
  reopen=()=>showShared(p);
  modal(`<h2>${esc(p.n)}</h2>${items.map(i=>i.b?`<div class="row" style="cursor:default">${cover(i.b)}<div class="mt"><b>${esc(i.b.title)}</b><span>${esc(i.b.author)}</span></div>${dot(i.b)}</div>`:
  `<div class="row" style="cursor:default;opacity:.6"><div class="mt"><b>${esc(i.t||'Unknown book')}</b><span>Not in this library</span></div></div>`).join('')}
  <div class="bar"><button data-act="close">Close</button></div>`);
}
function openHash(h){
  h=h||'';let m=h.match(/^#?\/@([\w.-]+)(?:\/(favorites|wishlist|book|wish)(?:\/([\w-]+))?)?\/?$/);
  if(m){openPage(m[1],m[2]||'',m[3]||'');return true}
  m=h.match(/^#?\/group\/([\w-]+)$/);if(m){if(S.groups.some(x=>x.id===m[1]))showGroup(m[1]);else toast('That group is not in this library');return true}
  m=h.match(/^#?g:(.*)\|([^|]*)$/);
  if(m){try{const name=decodeURIComponent(m[1]),ids=m[2]?m[2].split(','):[];

function beep(f,d,v){if(!AC)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.25,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function ding(){
  if(cfg.sound){audioInit();beep(1046,.09,.3);setTimeout(()=>beep(1568,.16,.3),90)}
  if(cfg.flash){const sc=$('#sc');if(sc){sc.classList.remove('fl');void sc.offsetWidth;sc.classList.add('fl')}}
}
async function api(path){
  if(!SHARE_WORKER)return null;
  try{const h={};if(user&&user.getIdToken)h.Authorization='Bearer '+await user.getIdToken();
    const r=await fetch(SHARE_WORKER.replace(/\/$/,'')+path,{headers:h});return r.ok?await r.json():null}catch(e){return null}
}

/* ===== swipe rows ===== */
const OPENW=150;let swOpen=null,swS=null,swBlock=0;
function swReset(el,anim){const r=el.querySelector('.row');r.style.transition=anim?'transform .25s cubic-bezier(.2,.8,.2,1)':'none';r.style.transform='';el.classList.remove('open','al','ar','go','full');el.style.removeProperty('--p');if(swOpen===el)swOpen=null}
document.addEventListener('touchstart',e=>{
  const sw=e.target.closest('.sw');
  if(swOpen&&swOpen!==sw)swReset(swOpen,1);
  if(!sw||e.target.closest('.swr'))return;
  const t=e.touches[0];swS={el:sw,x:t.clientX,y:t.clientY,lock:0,w:sw.offsetWidth,base:sw.classList.contains('open')?-OPENW:0,cur:0};
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!swS)return;const t=e.touches[0],dx=t.clientX-swS.x,dy=t.clientY-swS.y;
  if(!swS.lock){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.5)swS.lock=1;else{if(Math.abs(dy)>10)swS=null;return}}
  if(e.cancelable)e.preventDefault();
  const w=swS.w,x=Math.max(-w,Math.min(w,swS.base+dx)),sw=swS.el,row=sw.querySelector('.row');swS.cur=x;
  row.style.transition='none';row.style.transform='translateX('+x+'px)';
  sw.classList.toggle('al',x>0);sw.classList.toggle('ar',x<0);sw.classList.toggle('go',x>w*.45);sw.classList.toggle('full',x<-w*.5);
  sw.style.setProperty('--p',Math.min(1,Math.abs(x)/(w*.45)));
},{passive:false});
document.addEventListener('touchend',()=>{
  const s=swS;swS=null;if(!s||!s.lock)return;swBlock=Date.now();
  const{el,w,cur:x}=s,id=el.dataset.id,row=el.querySelector('.row');
  if(x>w*.45){swReset(el,1);togFav(id)}
  else if(x<-w*.5){row.style.transition='transform .2s ease-in';row.style.transform='translateX(-110%)';setTimeout(()=>delBook(id),190)}
  else if(x<-OPENW*.5){row.style.transition='transform .25s cubic-bezier(.2,.8,.2,1)';row.style.transform='translateX('+(-OPENW)+'px)';el.classList.add('open','ar');el.classList.remove('full','go');swOpen=el}
  else swReset(el,1);
});
document.addEventListener('touchcancel',()=>{if(swS&&swS.el)swReset(swS.el,1);swS=null});
function togFav(id){const b=S.books.find(x=>x.id===id);if(!b)return;b.fav=!b.fav;save();render();toast(b.fav?'Added to favorites':'Removed from favorites');if($('#pb'))showProfile()}
let undoT=0;
function snack(msg,undo){const e=$('#ut');e.innerHTML=`<span>${esc(msg)}</span><button data-act="undo">Undo</button>`;e.style.display='flex';e._u=undo;clearTimeout(undoT);undoT=setTimeout(()=>e.style.display='none',6000)}
function delBook(id){
  const b=S.books.find(x=>x.id===id);if(!b)return;
  const gs=S.groups.filter(g=>g.ids.includes(id)).map(g=>g.id),idx=S.books.indexOf(b);
  S.books=S.books.filter(x=>x!==b);S.groups.forEach(g=>g.ids=g.ids.filter(i=>i!==id));save();render();
  snack('Deleted \u201c'+b.title+'\u201d',()=>{S.books.splice(Math.min(idx,S.books.length),0,b);gs.forEach(gid=>{const g=S.groups.find(x=>x.id===gid);if(g&&!g.ids.includes(id))g.ids.push(id)});save();render()});

let rAll=false,rSpin=0;
function burst(rw){for(let i=0;i<28;i++){const c=document.createElement('i');c.className='cf';const a=Math.random()*Math.PI*2,d=60+Math.random()*130;c.style.cssText=`--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-30}px;--r:${Math.random()*720-360}deg;background:hsl(${Math.random()*360} 80% 60%)`;rw.appendChild(c);setTimeout(()=>c.remove(),1200)}}
function showRandom(){
  if(!S.books.length)return toast('Add some books first');
  modal(`<h2>Random book</h2><div class="chips" style="margin:0"><button data-act="rpool" data-id="in" class="${rAll?'':'on'}">In storage</button><button data-act="rpool" data-id="all" class="${rAll?'on':''}">All books</button></div>
  <div class="rw" id="rw"><div class="rm"></div><div class="rt" id="rt"></div></div><div id="rres" style="text-align:center;min-height:92px"></div>
  <div class="bar"><button class="p" data-act="rspin">Spin</button><button data-act="close">Close</button></div>`);
  setTimeout(spin,250);

function spin(){
  const P=S.books.filter(b=>rAll||!b.out),rt=$('#rt'),rw=$('#rw');if(!rt)return;
  clearInterval(rSpin);
  if(!P.length){rt.innerHTML='';$('#rres').innerHTML='<p class="mut">Nothing in storage to pick from. Try All books.</p>';return}
  const N=44,win=P[Math.floor(Math.random()*P.length)],items=[];
  for(let i=0;i<N;i++)items.push(P[Math.floor(Math.random()*P.length)]);
  const wi=N-5;items[wi]=win;
  rt.innerHTML=items.map(b=>`<div class="rc" style="background:hsl(${hue(b.title||'?')} 38% 36%)"><span>${esc((b.title||'?')[0].toUpperCase())}</span>${bkImg(b)}</div>`).join('');
  $('#rres').innerHTML='<p class="mut">Spinning\u2026</p>';
  const cw=118,vw=rw.clientWidth,tgt=-(wi*cw+52-vw/2),cards=[...rt.children];
  rt.style.transition='none';rt.style.transform='translate(0,-50%)';void rt.offsetWidth;
  rt.style.transition='transform 4.4s cubic-bezier(.1,.7,.12,1)';rt.style.transform='translate('+tgt+'px,-50%)';
  let last=-1;
  rSpin=setInterval(()=>{
    if(!$('#rt')){clearInterval(rSpin);return}
    let m41=0;try{m41=new DOMMatrix(getComputedStyle(rt).transform).m41}catch(e){}
    const idx=Math.round((vw/2-52-m41)/cw);
    if(idx!==last){last=idx;cards.forEach((c,i)=>c.classList.toggle('mid',i===idx));if(cfg.sound){audioInit();beep(700+(idx%5)*60,.03,.1)}}
  },40);
  rt.addEventListener('transitionend',()=>{
    clearInterval(rSpin);if(!$('#rt'))return;cards.forEach(c=>c.classList.remove('mid'));cards[wi].classList.add('won');burst(rw);ding();
    $('#rres').innerHTML=`<b style="font-size:18px">${esc(win.title)}</b><div class="mut">${esc(win.author||'')}</div><div class="bar" style="margin:10px 0 0"><button data-act="edit" data-id="${win.id}">Details</button><button data-act="rspin">Spin again</button></div>`;
  },{once:true});
}

    if(g){g.name=n;g.ids=ids;g.color=ci}else{g={id:uid(),name:n,ids,color:ci};S.groups.push(g)}
    save();render();scanG=g.id;scanBook();
    if($('#sc')){scs('Scanning into '+n);scanDone=()=>{scanG=null;groupForm(g.id);render()}}else scanG=null;
  }
  else if(a==='cont'){cont=!cont;ls('bookshelf.cont',cont?'1':'0');updC()}
  else if(a==='covers'){if(Date.now()-swBlock<400)return;cv=null;showCovers(id);if(el.dataset.back){const gid=el.dataset.back;cv.back=()=>showGroup(gid)}}
  else if(a==='pick')selCov(+el.dataset.i);
  else if(a==='addcov')$('#cvf').click();
  else if(a==='usecov'){const b=cv&&S.books.find(x=>x.id===cv.id);if(b){if(cv.sel)b.cover=cv.sel;save();const f=cv.back;closeM();render();if(f)f()}}
  else if(a==='cvclose'){const f=cv&&cv.back;closeM();if(f)f()}
  else if(a==='delcov')delCov();
  else if(a==='sort')showSort();
  else if(a==='setsort'){srt=id;ls('bookshelf.sort',srt);closeM();render()}
  else if(a==='vt'){vw=vw==='grid'?'list':'grid';ls('bookshelf.view',vw);render()}
  else if(a==='swgrp')showGroupPick(id);
  else if(a==='swdel'){delBook(id)}
  else if(a==='gtog'){const g=S.groups.find(x=>x.id===id),bid=el.dataset.b;if(g){const k=g.ids.indexOf(bid);if(k>-1)g.ids.splice(k,1);else g.ids.push(bid);save();render();showGroupPick(bid)}}
  else if(a==='gnew'){const n=$('#ng').value.trim();if(!n)return toast('Name the group');const bid=el.dataset.b;S.groups.push({id:uid(),name:n,ids:[bid],color:S.groups.length%GC.length});save();render();showGroupPick(bid)}
  else if(a==='undo'){const u=$('#ut');if(u._u)u._u();u.style.display='none'}
  else if(a==='rand')showRandom();
  else if(a==='rspin')spin();
  else if(a==='rpool'){rAll=id==='all';showRandom()}
  else if(a==='prof')showProfile('me');
  else if(a==='ptab')showProfile(id);
  else if(a==='fav'){const b=S.books.find(x=>x.id===id);if(b){b.fav=!b.fav;save();if(el.closest('#mb')&&!$('#pb'))el.textContent=b.fav?'Remove favorite':'Add to favorites';render();if($('#pb'))showProfile()}}
  else if(a==='avpick')$('#avf').click();
  else if(a==='avrm'){S.profile.avatar='';save();updAv();showProfile()}
  else if(a==='savep')saveProfile();
  else if(a==='hcheck')checkHandle();
  else if(a==='wlook'){const i=(x=>toIsbn(x)||x)($('#wi').value.replace(/[^\dX]/gi,'').toUpperCase());if(!i)return toast('Enter an ISBN first');toast('Looking up\u2026');
    (async()=>{const d=await lookup(i)||await lookupBC(i);if(d){$('#wi').value=i;$('#wt').value=d.title||'';$('#wa').value=d.author||'';wishCover=d.cover||''}else toast('No match. Type the details in.')})()}
  else if(a==='wadd'){const t=$('#wt').value.trim();if(!t)return toast('Add a title');addWish({title:t,author:$('#wa').value.trim(),isbn:$('#wi').value.replace(/[^\dX]/gi,'').toUpperCase(),cover:wishCover});wishCover='';showProfile()}
  else if(a==='wdel'){S.wish=S.wish.filter(w=>w.id!==id);save();showProfile()}
  else if(a==='wgot'){const w=S.wish.find(x=>x.id===id);if(w){addBook({title:w.title,author:w.author,isbn:w.isbn,cover:w.cover,msrp:w.msrp,cur:w.cur});S.wish=S.wish.filter(x=>x.id!==id);save();render();toast('Moved to your library');showProfile()}}
  else if(a==='wsh')shareSec('wish',id);
  else if(a==='shbook')shareSec('book',id);
  else if(a==='shr')shareSec(el.dataset.s||'',el.dataset.id||'');
  else if(a==='shcopy'){const l=shLink(el.dataset.s||'',el.dataset.id||'');navigator.clipboard.writeText(l).then(()=>toast('Link copied')).catch(()=>toast(l))}
  else if(a==='shrm'){S.profile.shb=(S.profile.shb||[]).filter(z=>z.id!==id);save();pubPush().catch(()=>{});showProfile()}
  else if(a==='shx')closePage();
  else if(a==='vsec'){pg.sec=el.dataset.s||'';pg.id='';drawPage();syncHash()}
  else if(a==='cfgv'){const v=el.dataset.v;setCfg(el.dataset.k,v==='0'?0:v==='1'?1:v);showProfile()}
  else if(a==='tsound'){audioInit();ding();if(!AC)toast('Sound is not available in this browser')}
  else if(a==='rstcfg'){cfg={sound:1,flash:1,theme:'auto',dense:0,outdays:1,dev:0,beta:{}};ls('bookshelf.cfg',JSON.stringify(cfg));applyCfg();render();showProfile()}
  else if(a==='csv'){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    const rows=[['Title','Author','ISBN','EAN','MSRP','Currency','Status','Favorite','Times out','Publisher','Pages','With','Notes'],...S.books.map(b=>[b.title,b.author,b.isbn,b.ean||'',b.msrp!=null?b.msrp:'',b.cur||'',b.out?'Out':'In storage',b.fav?'Yes':'',b.outs||0,b.pub||'',b.pages||'',b.holder||'',b.notes])];
    const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));l.download='bookshelf.csv';l.click()}
  else if(a==='mic')dictate(id,el.dataset.d==='1',el);
  else if(a==='acct')acctModal();
  else if(a==='google')authDo(()=>fb.a.signInWithPopup(new firebase.auth.GoogleAuthProvider()));
  else if(a==='signin')authDo(()=>fb.a.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value));
  else if(a==='signup')authDo(()=>fb.a.createUserWithEmailAndPassword($('#em').value.trim(),$('#pw').value));
  else if(a==='reset'){const e=$('#em').value.trim();if(!e)return toast('Type your email first');fb.a.sendPasswordResetEmail(e).then(()=>toast('Password reset email sent')).catch(x=>toast(authMsg(x)))}
  else if(a==='signout')fb.a.signOut().then(closeM);
  else if(a==='guest'){ls('bookshelf.guest','1');closeM()}
  else if(a==='saveu'){S.url=$('#url').value.trim();save();toast('Link saved')}
  else if(a==='exp'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));l.download='bookshelf-backup.json';l.click()}
  else if(a==='imp')$('#f').click();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.cfg){const k=t.dataset.cfg;if(k==='cont'){cont=t.checked;ls('bookshelf.cont',cont?'1':'0')}else{setCfg(k,t.checked?1:0);if(k==='dev')showProfile()}}
  else if(t.dataset.beta)setBeta(t.dataset.beta,t.checked);
  else if(t.dataset.sec)secToggle(t.dataset.sec,t.checked);
  else if(t.id==='cvf'){const f=t.files[0];if(f)addPhoto(f)}
  else if(t.id==='avf'){const f=t.files[0];if(f)setAvatar(f)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='s'){q=t.value;list()}
  else if(t.id==='isbn'&&$('#tpv')){clearTimeout(tlT);tlT=setTimeout(typeLook,650)}
  else if(t.id==='pks'){const k=t.value.toLowerCase();document.querySelectorAll('#mb .pkt').forEach(x=>x.style.display=x.dataset.q.includes(k)?'':'none')}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='qs'){srQ=e.target.value.trim();doSearch()}});
window.addEventListener('hashchange',()=>booted&&openHash(location.hash));
window.addEventListener('resize',applyCfg);
applyCfg();
render();
initCloud();
</script>
</body>
</html>
