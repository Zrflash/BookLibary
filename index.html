<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Bookshelf</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#16202e;--mut:#6b7686;--line:#dde2e9;--acc:#1f3a5f;--on:#fff;--g:#22b573;--r:#e5484d}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--card:#19212b;--ink:#eef2f7;--mut:#8f9bad;--line:#27313e;--acc:#8fb4e8;--on:#0c1624}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding:0 0 90px}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 6px}
h1{font:700 28px/1 ui-serif,Georgia,serif;margin:0;letter-spacing:-.01em}
h2{font:700 20px/1.2 ui-serif,Georgia,serif;margin:0 0 12px}
main{padding:8px 16px;max-width:640px;margin:0 auto}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px}
button.p{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
button.d{color:var(--r)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:0 0 10px}
.chips{display:flex;gap:8px;margin:0 0 12px}
.chips button{padding:6px 14px;border-radius:99px;font-size:14px}
.chips button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 0 8px;cursor:pointer}
.cv{width:44px;height:62px;border-radius:3px 6px 6px 3px;flex:none;overflow:hidden;display:grid;place-items:center;color:#fff;font:700 20px ui-serif,Georgia,serif;box-shadow:inset 4px 0 0 rgba(0,0,0,.2)}
.cv img{width:100%;height:100%;object-fit:cover}
.mt{flex:1;min-width:0}.mt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt span{color:var(--mut);font-size:14px}
.st{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut);padding:8px 10px;border-radius:99px}
.st i{width:14px;height:14px;border-radius:50%;background:var(--g);box-shadow:0 0 0 4px color-mix(in srgb,var(--g) 22%,transparent)}
.st.o i{background:var(--r);box-shadow:0 0 0 4px color-mix(in srgb,var(--r) 22%,transparent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.bar{display:flex;gap:8px;margin:0 0 12px}.bar button{flex:1}
.mut{color:var(--mut);font-size:14px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav button{flex:1;border:0;background:none;color:var(--mut);font-weight:600;padding:12px 4px}
nav button.on{color:var(--acc)}
#m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
#m.show{display:flex}
#mb{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
video{width:100%;border-radius:12px;background:#000;margin:0 0 10px;aspect-ratio:4/3;object-fit:cover}
label.ck{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
label.ck input{width:auto;margin:0}
#t{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:40;display:none;max-width:90%}
.qr{width:100%;border-radius:10px;background:#fff}
.f button.rec{background:var(--r);color:#fff;border-color:var(--r)}
#sc{position:fixed;inset:0;background:#000;z-index:30}
#sc video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;margin:0;aspect-ratio:auto;border-radius:0}
#sc:after{content:'';position:absolute;left:7%;right:7%;top:36%;height:28%;border:2px solid #fff9;border-radius:14px;pointer-events:none}
#sct{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 18px;background:linear-gradient(#000b,#0000);color:#fff}
#sct button{background:#0009;color:#fff;border-color:#fff5}
.cvs{position:relative;display:flex;gap:18px;align-items:center;overflow-x:auto;scroll-snap-type:x mandatory;padding:42px calc(50% - 60px) 46px;margin:0 0 10px;background:radial-gradient(55% 75% at 50% 50%,color-mix(in srgb,var(--acc) 28%,transparent),transparent 72%);scrollbar-width:none}
.cvs::-webkit-scrollbar{display:none}
.cvs.two{justify-content:center;padding-inline:0}
.cp{position:relative;flex:none;width:120px;aspect-ratio:2/3;border-radius:5px 12px 12px 5px;overflow:hidden;scroll-snap-align:center;display:grid;place-items:center;color:#fff;font:700 34px ui-serif,Georgia,serif;cursor:pointer;opacity:.55;filter:brightness(1.18) saturate(.55);transform:scale(.88);box-shadow:0 6px 14px rgba(0,0,0,.18),inset 5px 0 0 rgba(0,0,0,.18);transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s,filter .3s,box-shadow .3s}
.cp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cp:after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.32),rgba(255,255,255,0) 42%);pointer-events:none}
.cp.sel{opacity:1;filter:none;transform:scale(1.12);box-shadow:0 22px 40px rgba(0,0,0,.4),0 0 0 3px var(--acc),0 0 42px 8px color-mix(in srgb,var(--acc) 60%,transparent),inset 5px 0 0 rgba(0,0,0,.2)}
.cp.add{background:rgba(128,128,128,.22);border:2px solid rgba(128,128,128,.4);box-shadow:none;color:var(--mut);font:300 56px/1 -apple-system,system-ui,sans-serif;opacity:1;filter:none;backdrop-filter:blur(4px)}
.cp.add:after{display:none}.cp.add:active{transform:scale(.82)}
.bd{position:absolute;left:6px;top:6px;z-index:2;font:600 10px/1 -apple-system,sans-serif;background:var(--g);color:#06251a;padding:4px 7px;border-radius:99px;font-style:normal}
.cv[data-act]{cursor:pointer}
#scc{width:46px;height:46px;padding:0;display:grid;place-items:center;border-radius:50%}
#scc.on{background:var(--g);color:#06251a;border-color:var(--g)}
.scn #t{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
#sct span{flex:1;font-size:15px;text-align:right}
.f{display:flex;gap:8px}.f input{flex:1;min-width:0}.f button{flex:none;margin:0 0 10px}
</style>
</head>
<body>
<header><h1>Bookshelf</h1><div><button id="acb" data-act="acct">Sign in</button> <button data-act="set" aria-label="Settings">Settings</button></div></header>
<main id="main"></main>
<nav>
<button data-v="lib">Library</button><button data-v="add">Add book</button><button data-v="grp">Groups</button>
</nav>
<div id="m"><div id="mb"></div></div>
<div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='bookshelf.v1';
const FIREBASE_CONFIG={
  apiKey: "AIzaSyCrucWZzoh23lrNthI5xq8w4CaUYEckdLY",
  authDomain: "booklibary-5f7cc.firebaseapp.com",
  databaseURL: "https://booklibary-5f7cc-default-rtdb.firebaseio.com",
  projectId: "booklibary-5f7cc",
  storageBucket: "booklibary-5f7cc.firebasestorage.app",
  messagingSenderId: "190595448053",
  appId: "1:190595448053:web:7d3092eb7b6e62a90c19bc",
  measurementId: "G-TMK3DENDYT"};
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
function loadGuest(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
let S=Object.assign({books:[],groups:[],url:''},loadGuest()||{}),user=null,fb=null,unsub=null,merged=false,booted=false;
const pendingHash=location.hash;
function save(){if(user)push();else try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save on this device')}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let view='lib',q='',flt='all',draft={},reopen=null,rd=null,tt,stm=0,ocrOn=false,tess=null,rec=null;

function toast(s){const t=$('#t');t.textContent=s;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2600)}
function modal(h){$('#mb').innerHTML=h;$('#m').classList.add('show')}
function closeM(){clearTimeout(stm);ocrOn=false;cv=null;if(rd){try{rd.reset()}catch(e){}rd=null}reopen=null;const sc=$('#sc');if(sc){sc.remove();if(scanDone){const f=scanDone;scanDone=null;setTimeout(f,0)}}document.body.classList.remove('scn');$('#m').classList.remove('show');$('#mb').innerHTML=''}
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function cover(b,a){return `<div class="cv"${a?` data-act="covers" data-id="${b.id}" role="button" aria-label="Change cover"`:''} style="background:hsl(${hue(b.title||'?')} 38% 36%)">${(b.cover||b.isbn)?`<img src="${esc(b.cover||'https://covers.openlibrary.org/b/isbn/'+b.isbn+'-M.jpg?default=false')}" alt="" onerror="this.remove()">`:''}<span>${esc((b.title||'?')[0].toUpperCase())}</span></div>`}
function dot(b){return `<button class="st ${b.out?'o':''}" data-act="tog" data-id="${b.id}" aria-label="${b.out?'Out of storage':'In storage'}. Tap to change"><i></i>${b.out?'Out':'In storage'}</button>`}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const m=$('#main');
  if(view==='lib'){
    const n=S.books.length,o=S.books.filter(b=>b.out).length;
    m.innerHTML=`<input id="s" type="search" placeholder="Search title, author or ISBN" value="${esc(q)}">
    <div class="chips">${[['all','All '+n],['in','In storage '+(n-o)],['out','Out '+o]].map(c=>`<button data-act="flt" data-id="${c[0]}" class="${flt===c[0]?'on':''}">${c[1]}</button>`).join('')}</div><div id="list"></div>`;
    list();
  }else if(view==='add'){
    m.innerHTML=`<div class="card"><h2>Add a book</h2>
    <div class="bar"><button class="p" data-act="scanisbn">Scan barcode</button></div>
    <div class="f"><input id="isbn" placeholder="ISBN (optional)" value="${esc(draft.isbn||'')}"><button data-act="mic" data-id="isbn" data-d="1" aria-label="Speak the ISBN">Speak</button></div>
    <button data-act="look" style="margin:0 0 14px">Look up details from ISBN</button>
    <div class="f"><input id="ti" placeholder="Title" value="${esc(draft.title||'')}"><button data-act="mic" data-id="ti" aria-label="Speak the title">Speak</button></div>
    <div class="f"><input id="au" placeholder="Author" value="${esc(draft.author||'')}"><button data-act="mic" data-id="au" aria-label="Speak the author">Speak</button></div>
    <textarea id="no" rows="2" placeholder="Notes (optional)">${esc(draft.notes||'')}</textarea>
    <button class="p" data-act="addman" style="width:100%">Add to library</button></div>`;
  }else{
    m.innerHTML=`<div class="bar"><button class="p" data-act="newg">New group</button><button data-act="scanqr">Scan group QR</button></div>`+
    (S.groups.length?S.groups.map(g=>{const bs=g.ids.map(i=>S.books.find(b=>b.id===i)).filter(Boolean);const o=bs.filter(b=>b.out).length;
      return `<div class="row" data-act="grp" data-id="${g.id}"><div class="mt"><b>${esc(g.name)}</b><span>${bs.length} books · ${o} out</span></div></div>`}).join(''):
    `<div class="empty">No groups yet. Make one for a shelf, box or room, then print its QR code.</div>`);
  }
}
function list(){
  const k=q.toLowerCase();
  const bs=S.books.filter(b=>(flt==='all'||(flt==='out')===!!b.out)&&(b.title+' '+b.author+' '+b.isbn).toLowerCase().includes(k)).sort((a,b)=>a.title.localeCompare(b.title));
  $('#list').innerHTML=bs.length?bs.map(b=>`<div class="row" data-act="edit" data-id="${b.id}">${cover(b,1)}<div class="mt"><b>${esc(b.title)}</b><span>${esc(b.author||'Unknown author')}</span></div>${dot(b)}</div>`).join(''):
  `<div class="empty">${S.books.length?'No books match.':'Your library is empty. Tap Add book to scan or type one in.'}</div>`;
}

async function lookup(isbn){
  try{const r=await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);const j=await r.json();const d=j['ISBN:'+isbn];
    if(d)return{title:d.title+(d.subtitle?': '+d.subtitle:''),author:(d.authors||[]).map(a=>a.name).join(', '),cover:(d.cover&&d.cover.medium)||''}}catch(e){}
  try{const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);const j=await r.json();const v=j.items&&j.items[0]&&j.items[0].volumeInfo;
    if(v)return{title:v.title+(v.subtitle?': '+v.subtitle:''),author:(v.authors||[]).join(', '),cover:((v.imageLinks&&v.imageLinks.thumbnail)||'').replace('http:','https:')}}catch(e){}
  return null;
}
function addBook(o){
  o.isbn=toIsbn(o.isbn||'')||o.isbn||'';
  if(o.isbn&&S.books.some(b=>(toIsbn(b.isbn)||b.isbn)===o.isbn)){toast('Already in your library');return false}
  const nb={id:uid(),title:o.title,author:o.author||'',isbn:o.isbn||'',cover:o.cover||'',notes:o.notes||'',out:false};S.books.push(nb);
  save();return nb;
}
async function isbnAdd(isbn,keep){
  if(scanG)return addToGroup(isbn);
  toast('Looking up '+isbn+'…');
  const d=await lookup(isbn)||await lookupBC(isbn);
  if(d&&addBook({...d,isbn})){toast('Added: '+d.title);if(keep)bump();else{view='lib';render()}}
  else if(!d){
    if(keep){addBook({title:'Unknown book '+isbn,isbn});toast('Not found. Saved as Unknown book so you can edit it later.');bump()}
    else{draft={isbn};view='add';render();toast('Not found. Type the title in.')}
  }
}
const scs=t=>{const e=$('#scs');if(e)e.textContent=t};
function scan(cb,multi,ocr){
  if(!navigator.mediaDevices||!window.ZXing){toast('Camera not available. Allow camera access, or type or speak the ISBN.');return}
  closeM();
  const o=document.createElement('div');o.id='sc';
  o.innerHTML=`<video id="v" playsinline muted></video><div id="sct"><button data-act="close">Done</button>${ocr?`<button id="scc" data-act="cont" class="${cont?'on':''}" aria-pressed="${cont}" title="Continuous scan ${cont?'on':'off'}">${cIcon()}</button>`:''}<span id="scs">${ocr?(cont?'Continuous scan on. Show an ISBN or barcode':'Show the printed ISBN or the barcode'):'Point at the QR code'}</span></div>`;
  document.body.appendChild(o);document.body.classList.add('scn');
  rd=new ZXing.BrowserMultiFormatReader();
  rd.decodeFromConstraints({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}},'v',r=>{if(r){const t=r.getText();if(multi){if(cb(t,'bc'))closeM()}else{closeM();cb(t)}}}).catch(()=>{closeM();toast('Camera blocked. Allow camera access, or type or speak the ISBN.')});
  if(ocr)setTimeout(()=>ocrLoop(cb),700);
}
async function ocrLoop(cb){
  if(!$('#sc'))return;ocrOn=true;const v=$('#v');
  try{
    if(!window.Tesseract){scs('Loading text reader…');await loadJS('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js')}
    if(!tess){tess=await Tesseract.createWorker('eng');await tess.setParameters({tessedit_pageseg_mode:'11'})}
  }catch(e){ocrOn=false;scs('Text reader unavailable. Scanning barcode only.');cb('','noocr');return}
  const c=document.createElement('canvas'),x=c.getContext('2d');let n=0;
  while(ocrOn&&$('#sc')){
    if(v&&v.videoWidth){
      const k=Math.min(1,1600/v.videoWidth);c.width=v.videoWidth*k;c.height=v.videoHeight*k;
      if(n%2){x.save();x.translate(c.width,c.height);x.rotate(Math.PI);x.drawImage(v,0,0,c.width,c.height);x.restore()}else x.drawImage(v,0,0,c.width,c.height);
      scs(scanN?'Added '+scanN+'. Reading the next ISBN…':'Reading the ISBN…');
      try{const r=await tess.recognize(c);if(!ocrOn)break;if(cb(r.data.text,'ocr')){closeM();break}}catch(e){}
      n++;
    }
    await new Promise(r=>setTimeout(r,200));
  }
}

function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function qrCanvas(text,title){
  const qr=qrcode(0,'L');qr.addData(text);qr.make();
  const n=qr.getModuleCount(),cs=Math.max(3,Math.floor(560/n)),pad=40,sz=n*cs+pad*2,c=document.createElement('canvas');
  c.width=sz;c.height=sz+50;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(qr.isDark(r,k))x.fillRect(pad+k*cs,pad+r*cs,cs,cs);
  x.font='bold 28px -apple-system,sans-serif';x.textAlign='center';x.fillText(title.slice(0,28),sz/2,sz+14);
  return c;
}
function showQR(id){
  const g=S.groups.find(x=>x.id===id);if(!g)return;
  const txt='g:'+encodeURIComponent(g.name.replace(/\|/g,' '))+'|~'+g.id;
  const base=S.url||(location.protocol.startsWith('http')?location.origin+location.pathname:'');
  const link=base?base+'#'+txt:'shortcuts://run-shortcut?name=Bookshelf&input=text&text='+encodeURIComponent(txt);
  let c;
  try{c=qrCanvas(link,g.name)}catch(e){toast('Too many books for one QR. Split the group.');return}
  const url=c.toDataURL('image/png');
  modal(`<h2>${esc(g.name)} QR</h2><img class="qr" src="${url}" alt="QR code for ${esc(g.name)}">
  <p class="mut">Press and hold the image to save it to Photos, or use the buttons. This code never goes out of date: it always opens the group's current books, even after you add or remove some. Older codes keep working too.</p>
  <div class="bar"><a id="dl" download="${esc(g.name)}-qr.png" href="${url}" style="display:none"></a><button class="p" data-act="saveqr">Save image</button><button data-act="grp" data-id="${id}">Back</button></div>`);
  window._qr={url,name:g.name};
}
async function saveQR(){
  const {url,name}=window._qr;
  try{const f=new File([await (await fetch(url)).blob()],name+'-qr.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==='AbortError')return}
  $('#dl').click();
}

function showGroup(id){
  const g=S.groups.find(x=>x.id===id);if(!g)return closeM();
  reopen=()=>showGroup(id);
  const bs=g.ids.map(i=>S.books.find(b=>b.id===i)).filter(Boolean);
  modal(`<h2>${esc(g.name)}</h2>${bs.length?bs.map(b=>`<div class="row" style="cursor:default">${cover(b)}<div class="mt"><b>${esc(b.title)}</b><span>${esc(b.author)}</span></div>${dot(b)}</div>`).join(''):'<div class="empty">No books in this group.</div>'}
  <div class="bar"><button class="p" data-act="qr" data-id="${id}">Make QR code</button><button data-act="editg" data-id="${id}">Edit</button></div>
  <div class="bar"><button data-act="close">Close</button></div>`);
}
function showShared(p){
  const items=p.b.map(x=>{const id=Array.isArray(x)?x[0]:x,t=Array.isArray(x)?x[1]:'';return{b:S.books.find(b=>b.id===id)||S.books.find(b=>t&&b.title.startsWith(t)),t}});
  reopen=()=>showShared(p);
  modal(`<h2>${esc(p.n)}</h2>${items.map(i=>i.b?`<div class="row" style="cursor:default">${cover(i.b)}<div class="mt"><b>${esc(i.b.title)}</b><span>${esc(i.b.author)}</span></div>${dot(i.b)}</div>`:
  `<div class="row" style="cursor:default;opacity:.6"><div class="mt"><b>${esc(i.t||'Unknown book')}</b><span>Not in this library</span></div></div>`).join('')}
  <div class="bar"><button data-act="close">Close</button></div>`);
}
function openHash(h){
  h=h||'';let m=h.match(/^#?g:(.*)\|([^|]*)$/);
  if(m){try{const name=decodeURIComponent(m[1]),ids=m[2]?m[2].split(','):[];
    let g=ids[0]&&ids[0][0]==='~'?S.groups.find(x=>x.id===ids[0].slice(1)):null;
    g=g||S.groups.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!g){const sc=S.groups.map(x=>[x,x.ids.filter(i=>ids.includes(i)).length]).filter(a=>a[1]).sort((a,b)=>b[1]-a[1]);g=sc[0]&&sc[0][0]}

/* ---- scanning: ISBN first, other barcodes as fallback ---- */
const chk13=s=>{let t=0;for(let i=0;i<12;i++)t+=s[i]*(i%2?3:1);return (10-t%10)%10==s[12]};
const chk10=s=>{let t=0;for(let i=0;i<10;i++)t+=(s[i]=='X'?10:+s[i])*(10-i);return t%11==0};
function toIsbn(s){s=String(s).replace(/[\s-]/g,'').toUpperCase();if(/^97[89]\d{10}$/.test(s)&&chk13(s))return s;
  if(/^\d{9}[\dX]$/.test(s)&&chk10(s)){const b='978'+s.slice(0,9);let t=0;for(let i=0;i<12;i++)t+=b[i]*(i%2?3:1);return b+(10-t%10)%10}return''}
async function lookupBC(c){try{const j=await (await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(c)+'&limit=1&fields=title,author_name,isbn')).json();
  const x=j.docs&&j.docs[0];if(x)return{title:x.title,author:(x.author_name||[]).join(', '),isbn:(x.isbn&&x.isbn[0])||''}}catch(e){}return null}
function ocrIsbn(t){
  const u=String(t).toUpperCase(),re=/[0-9OIL][0-9OIL\s-]{8,22}[0-9X]/g;let m;
  while((m=re.exec(u))){
    const s=m[0].replace(/[OIL]/g,c=>c=='O'?'0':'1').replace(/[^0-9X]/g,'');
    const kw=/[I1L][S5][BE8][NM]|BOOK\s*NUMBER/.test(u.slice(Math.max(0,m.index-32),m.index));
    for(const L of [13,10])for(let i=0;i+L<=s.length;i++){const k=toIsbn(s.slice(i,i+L));if(k&&(L===13||kw))return k}
  }
  return'';
}
let cont=ls('bookshelf.cont')==='1',scanN=0,lastI='',lastT=0,pauseT=0;
const cIcon=()=>`<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M16.95 7.05A7 7 0 1 0 16.95 16.95" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>${cont?'':'<path d="M4 20L20 4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>'}</svg>`;
function updC(){const b=$('#scc');if(!b)return;b.innerHTML=cIcon();b.classList.toggle('on',cont);b.setAttribute('aria-pressed',cont);b.title='Continuous scan '+(cont?'on':'off');scs(cont?'Continuous scan on. Scan the next book':'Continuous scan off')}
const bump=()=>{scanN++;scs('Added '+scanN+(scanN>1?' books':' book')+'. Scan the next one');render()};
function scanBook(){
  scanN=0;lastI='';let t0=Date.now(),ocrOK=true,tries=0,bcI='',bcO='';
  const take=(i,fn)=>{
    if(cont){
      if(i===lastI&&Date.now()-lastT<5000)return false;
      lastI=i;lastT=Date.now();pauseT=Date.now()+1500;t0=Date.now();tries=0;bcI='';bcO='';fn(i);return false;
    }
    fn(i);return true;
  };
  scan((t,k)=>{
    if(Date.now()<pauseT)return false;
    const el=Date.now()-t0;
    if(k==='noocr')ocrOK=false;
    else if(k==='ocr'){tries++;const f=ocrIsbn(t);if(f)return take(f,i=>isbnAdd(i,cont))}
    else{const i=toIsbn(t);if(i)bcI=i;else if(!bcO&&/^\d{8,14}$/.test(t))bcO=t}
    if(bcI&&(!ocrOK||tries>=2||el>(tries?7000:3500)))return take(bcI,i=>isbnAdd(i,cont));
    if(!bcI&&bcO&&(!ocrOK||tries>=4||el>9000))return take(bcO,c=>useBarcode(c,cont));
    return false;
  },true,true);
}
async function useBarcode(c,keep){
  if(scanG)return addToGroup(c);
  toast('No ISBN found. Trying barcode '+c+'…');
  const d=await lookup(c)||await lookupBC(c);
  if(d&&addBook({...d,isbn:d.isbn||c})){toast('Added: '+d.title);if(keep)bump();else{view='lib';render()}}
  else if(!d){
    if(keep){addBook({title:'Unknown book '+c,isbn:c});toast('No match. Saved as Unknown book so you can edit it later.');bump()}
    else{draft={isbn:c};view='add';render();toast('No match for that barcode. Type the title in.')}
  }
}
function doLook(){
  const i=(x=>toIsbn(x)||x)($('#isbn').value.replace(/[^\dX]/gi,'').toUpperCase());if(!i)return toast('Enter an ISBN first');
  draft={isbn:i,title:$('#ti').value,author:$('#au').value,notes:$('#no').value};toast('Looking up…');
  lookup(i).then(d=>d||lookupBC(i)).then(d=>{if(d)draft={...draft,...d,isbn:i};else toast('No match. Type the details in.');render()});
}
const NW={zero:0,oh:0,o:0,one:1,won:1,two:2,to:2,too:2,three:3,tree:3,four:4,for:4,fore:4,five:5,six:6,seven:7,eight:8,ate:8,nine:9,x:'X',ex:'X',eks:'X'};
function parseSpoken(t){
  const w=String(t).toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);let out='';
  const dg=k=>NW.hasOwnProperty(k)?NW[k]:/^\d+$/.test(k)?k:'';
  for(let i=0;i<w.length;i++){
    if((w[i]==='double'||w[i]==='triple')&&i+1<w.length){out+=String(dg(w[i+1])).repeat(w[i]==='double'?2:3);i++}
    else out+=dg(w[i]);
  }
  return out.replace(/[^0-9X]/g,'');
}
function dictate(id,digits,b){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(rec){rec.stop();return}
  if(!SR)return toast('Voice input is not supported in this browser');
  const input=$('#'+id),r=rec=new SR();let fin='';
  r.lang=navigator.language||'en-US';r.continuous=true;r.interimResults=true;r.maxAlternatives=3;
  r.onstart=()=>{b.classList.add('rec');b.textContent='Stop';toast(digits?'Say the ISBN digits':'Listening…')};
  r.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const res=e.results[i];
      if(res.isFinal){let best=res[0].transcript;
        if(digits)for(let k=0;k<res.length;k++)if(toIsbn(parseSpoken(fin+' '+res[k].transcript))){best=res[k].transcript;break}
        fin+=' '+best}
      else interim+=res[0].transcript;
    }
    input.value=digits?parseSpoken(fin+' '+interim):(fin+' '+interim).trim();
    if(digits&&toIsbn(input.value))r.stop();
  };
  r.onerror=e=>toast(e.error==='not-allowed'||e.error==='service-not-allowed'?'Microphone blocked. Allow it for this site in Safari settings.':'Could not hear that. Tap Speak and try again.');
  r.onend=()=>{rec=null;b.classList.remove('rec');b.textContent='Speak';if(digits&&toIsbn(input.value))doLook()};
  try{r.start()}catch(e){rec=null}
}

function coverList(b){

async function fetchAlts(b){

  if(isbn){
    try{const j=await (await fetch('https://openlibrary.org/isbn/'+isbn+'.json')).json();(j.covers||[]).filter(x=>x>0).forEach(c=>add('https://covers.openlibrary.org/b/id/'+c+'-L.jpg?default=false'))}catch(e){}
    add('https://covers.openlibrary.org/b/isbn/'+isbn+'-L.jpg?default=false');
    try{const j=await (await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn)).json();const v=j.items&&j.items[0]&&j.items[0].volumeInfo;if(v&&v.imageLinks)add((v.imageLinks.thumbnail||v.imageLinks.smallThumbnail).replace('http:','https:').replace('&edge=curl',''))}catch(e){}
  }

  else if(a==='newg')groupForm();
  else if(a==='editg')groupForm(id);
  else if(a==='saveg'){const n=$('#gn').value.trim();if(!n)return toast('Name the group');const ids=[...document.querySelectorAll('#mb .ck input:checked')].map(x=>x.value);
    if(id){Object.assign(S.groups.find(x=>x.id===id),{name:n,ids})}else S.groups.push({id:uid(),name:n,ids});save();closeM();render()}
  else if(a==='delg'){if(confirm('Delete this group? Books stay in your library.')){S.groups=S.groups.filter(x=>x.id!==id);save();closeM();render()}}
  else if(a==='grp')showGroup(id);
  else if(a==='qr')showQR(id);
  else if(a==='saveqr')saveQR();
  else if(a==='scanqr')scan(t=>{const i=t.indexOf('text=');openHash(i>-1?decodeURIComponent(t.slice(i+5)):t.slice(Math.max(0,t.indexOf('#'))))||toast('That is not a Bookshelf group code')});
  else if(a==='cont'){cont=!cont;ls('bookshelf.cont',cont?'1':'0');updC()}
  else if(a==='covers'){cv=null;showCovers(id)}
  else if(a==='pick')selCov(+el.dataset.i);
  else if(a==='addcov')$('#cvf').click();
  else if(a==='usecov'){const b=cv&&S.books.find(x=>x.id===cv.id);if(b){if(cv.sel)b.cover=cv.sel;save();closeM();render()}}
  else if(a==='delcov')delCov();
  else if(a==='scang'){
    const n=$('#gn').value.trim();if(!n)return toast('Name the group first');
    const ids=[...document.querySelectorAll('#mb .ck input:checked')].map(x=>x.value);
    let g=S.groups.find(x=>x.id===id);
    if(g){g.name=n;g.ids=ids}else{g={id:uid(),name:n,ids};S.groups.push(g)}
    save();render();scanG=g.id;scanBook();
    if($('#sc')){scs('Scan books into '+n);scanDone=()=>{scanG=null;groupForm(g.id);render()}}else scanG=null;
  }
  else if(a==='mic')dictate(id,el.dataset.d==='1',el);
  else if(a==='acct')acctModal();
  else if(a==='google')authDo(()=>fb.a.signInWithPopup(new firebase.auth.GoogleAuthProvider()));
  else if(a==='signin')authDo(()=>fb.a.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value));
  else if(a==='signup')authDo(()=>fb.a.createUserWithEmailAndPassword($('#em').value.trim(),$('#pw').value));
  else if(a==='reset'){const e=$('#em').value.trim();if(!e)return toast('Type your email first');fb.a.sendPasswordResetEmail(e).then(()=>toast('Password reset email sent')).catch(x=>toast(authMsg(x)))}
  else if(a==='signout')fb.a.signOut().then(closeM);
  else if(a==='guest'){ls('bookshelf.guest','1');closeM()}
  else if(a==='set')settings();
  else if(a==='saveu'){S.url=$('#url').value.trim();save();toast('Link saved')}
  else if(a==='exp'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));l.download='bookshelf-backup.json';l.click()}
  else if(a==='imp')$('#f').click();
});
document.addEventListener('change',e=>{if(e.target.id==='cont'){cont=e.target.checked;ls('bookshelf.cont',cont?'1':'0')}else if(e.target.id==='cvf'){const f=e.target.files[0];if(f)addPhoto(f)}});
document.addEventListener('input',e=>{if(e.target.id==='s'){q=e.target.value;list()}});
window.addEventListener('hashchange',()=>booted&&openHash(location.hash));
render();
initCloud();
</script>
</body>
</html>
